spring.application.name=payment-service
server.port=8087

spring.datasource.url=jdbc:postgresql://postgres:5432/ecommerce_payment?options=-c%20timezone%3DUTC
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.ecommerce.payment.dto.DomainEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.ecommerce.payment.dto
spring.kafka.consumer.properties[spring.json.use.type.headers]=false