apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vendor-service
  template:
    metadata:
      labels:
        app: vendor-service
    spec:
      containers:
        - name: vendor-service
          image: e-commerce-vendor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: vendor-service
  namespace: ecommerce
spec:
  selector:
    app: vendor-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP