apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-service
  template:
    metadata:
      labels:
        app: authentication-service
    spec:
      containers:
        - name: authentication-service
          image: e-commerce-authentication-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081

          # Give Spring Boot enough time to start
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          # Kubernetes uses this to decide whether
          # the application is ready to receive traffic
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          # Kubernetes uses this to decide whether
          # the application needs to be restarted
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: authentication-service
  namespace: ecommerce
spec:
  selector:
    app: authentication-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP