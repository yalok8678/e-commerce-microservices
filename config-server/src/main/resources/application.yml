spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/yalok8678/ecommerce-config-repo.git
          default-label: main
          clone-on-start: true

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always