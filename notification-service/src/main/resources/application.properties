# =========================================================
# APPLICATION
# =========================================================

spring.application.name=notification-service

server.port=8088


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://postgres:5432/ecommerce_notification?options=-c%20timezone%3DUTC

spring.datasource.username=postgres

spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.ecommerce.notification.dto.DomainEvent

spring.kafka.consumer.properties[spring.json.trusted.packages]=com.ecommerce.notification.dto

# =========================================================
# Kafka Retry / DLT Testing
# =========================================================

app.kafka.test-failure=false

spring.kafka.consumer.properties[spring.json.use.type.headers]=false

jwt.secret=my-super-secret-key-for-ecommerce-authentication-service-2026

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

# =========================================================
# KAFKA PRODUCER
# =========================================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer